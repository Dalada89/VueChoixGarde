name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            architecture: x86_64
            bundle: dist/VueChoixGarde
            executable: dist/VueChoixGarde/VueChoixGarde
          - os: windows-latest
            platform: windows
            architecture: x86_64
            bundle: dist/VueChoixGarde
            executable: dist/VueChoixGarde/VueChoixGarde.exe
          - os: macos-14
            platform: macos
            architecture: arm64
            bundle: dist/VueChoixGarde.app
            executable: dist/VueChoixGarde.app/Contents/MacOS/VueChoixGarde
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: false
      - name: Install Linux Qt build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-3 libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0
      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python -c 'import os,tomllib; version=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; tag=os.environ["RELEASE_TAG"]; assert tag == f"v{version}", f"tag {tag} does not match project version {version}"'
      - name: Install locked build dependencies
        run: uv sync --locked --group build
      - name: Generate third-party notice inventory
        run: uv run python tools/generate_third_party_notices.py
      - name: Prepare application icon and version info
        run: uv run python tools/generate_icon.py
      - name: Build one-folder application
        run: uv run pyinstaller --clean --noconfirm --distpath dist --workpath build/pyinstaller packaging/vuechoixgarde.spec
      - name: Scan bundle contents
        run: uv run python tools/check_bundle.py "${{ matrix.bundle }}"
      - name: Smoke test packaged application
        run: "${{ matrix.executable }}" --smoke-test
      - name: Create archive and checksum
        run: uv run python tools/package_artifact.py "${{ matrix.bundle }}" "$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" "${{ matrix.platform }}" "${{ matrix.architecture }}" --output dist/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create draft GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create aggregate checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --draft --generate-notes --title "VueChoixGarde ${RELEASE_TAG}"
