[project]
name = "vuechoixgarde"
version = "0.1.0"
description = "A local desktop application for sorting images into destination folders."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "filelock>=4.2.0",
    "pi-heif>=1.4.0",
    "pillow>=12.3.0",
    "platformdirs>=4.13.3",
    "pyside6>=6.12.0",
]

[project.scripts]
vuechoixgarde = "vuechoixgarde.__main__:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
build = ["pyinstaller>=6.22.3"]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PTH", "N", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"socket" = { msg = "Network access is forbidden (NFR-005)." }
"urllib" = { msg = "Network access is forbidden (NFR-005)." }
"http" = { msg = "Network access is forbidden (NFR-005)." }
"ssl" = { msg = "Network access is forbidden (NFR-005)." }
"ftplib" = { msg = "Network access is forbidden (NFR-005)." }
"smtplib" = { msg = "Network access is forbidden (NFR-005)." }
"telnetlib" = { msg = "Network access is forbidden (NFR-005)." }
"xmlrpc" = { msg = "Network access is forbidden (NFR-005)." }
"websocket" = { msg = "Network access is forbidden (NFR-005)." }
"websockets" = { msg = "Network access is forbidden (NFR-005)." }
"requests" = { msg = "Network access is forbidden (NFR-005)." }
"httpx" = { msg = "Network access is forbidden (NFR-005)." }
"aiohttp" = { msg = "Network access is forbidden (NFR-005)." }
"PySide6.QtNetwork" = { msg = "Network access is forbidden (NFR-005)." }

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"
